- name: Utegruppen – lek, lärande och trygghet utomhus
  description: |
    <p>
    Utegruppen ansvarar för förskolans utemiljö året runt. 
    Här handlar det både om skötsel och om att utveckla gården till en plats som är <b>säker, rolig, kreativ och pedagogisk.</b>
    </p>
    <p>
    Inom utegruppen finns även en projektgrupp som arbetar långsiktigt med att ta fram idéer för nya lekmiljöer, naturlek, odling och skapande ytor – alltid i dialog med pedagogerna och med barnens säkerhet i fokus.
    </p>
- name: Innegruppen – en trygg, trivsam och giftfri miljö
  description: |
    <p>
    Innegruppen ansvarar för förskolans inomhusmiljö och ser till att lokalerna är säkra, funktionella och trivsamma. 
    Gruppen arbetar löpande med underhåll och utveckling samt genomför två gemensamma städdagar per år.
    </p>
    <p>
    Städdagarna är viktiga tillfällen för att tillsammans se över lokalerna, upptäcka förbättringsbehov – och samtidigt träffas, samarbeta och stärka gemenskapen. Ett särskilt fokus ligger på säkerhet och en giftfri miljö.
    </p>
- name: Arrangemangsgruppen – gemenskap, glädje och synlighet
  description: |
    <p>
    Arrangemangsgruppen arbetar med att skapa sammanhang som bygger gemenskap i föreningen.
    Gruppen arrangerar aktiviteter för barn, föräldrar och personal – som utflykter, loppisar, familjegympa, after work och temafester.
    </p>
    <p>
    Festerna har ofta olika teman med minnesvärda utklädnader och kvällar som sent glöms. 
    Gruppen ansvarar även för marknadsföring, öppet hus, introduktion av nya familjer och faddertilldelning.
    </p>
- name: IT-gruppen – teknik som förenklar vardagen
  description: |
    <p>
    IT-gruppen ser till att förskolans digitala system fungerar på ett säkert och smidigt sätt.
    Gruppen ansvarar för teknik, struktur och lösningar som underlättar för personal, styrelse och administration.
    </p>
    <p>
    Här passar du som tycker om teknik, problemlösning och att skapa ordning som gör vardagen enklare för alla.
    </p>
- name: Personalgruppen – en stabil grund i verksamheten
  description: |
    <p>
    Personalgruppen är en mycket viktig funktion i föräldrakooperativet och fungerar som en länk
    mellan styrelse och personal. Gruppen arbetar med löne- och pensionsadministration,
    personalstöd, arbetsmiljöfrågor och trivsel.
    </p>
    <p>
    Genom sitt arbete bidrar personalgruppen till trygghet, kontinuitet och goda förutsättningar för
    personalen att fokusera på barnens lärande och utveckling.
    </p>
